# Configuración SOLO para los tests: base de datos H2 en memoria (no necesita Docker)
spring.datasource.url=jdbc:h2:mem:gamerzone;MODE=MySQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop

gamerzone.user.password=test-user
gamerzone.admin.password=test-admin
gamerzone.organizador.password=test-org

# Clave JWT solo para tests (Base64, 32 bytes)
gamerzone.jwt.secret=dGVzdC1zZWNyZXQtcGFyYS1qd3QtZ2FtZXJ6b25lLTMyYg==
gamerzone.jwt.expiracion-minutos=60
spring.application.name=gamerzone

# Credenciales: en producción se definen como variables de entorno
gamerzone.user.password=${GZ_USER_PASSWORD:ClaveLocal#1}
gamerzone.admin.password=${GZ_ADMIN_PASSWORD:ClaveAdmin#2}

# Sesión y cookies
server.servlet.session.timeout=15m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=strict
# Activar cuando la app corra con HTTPS:
# server.servlet.session.cookie.secure=true

# No mostrar detalles internos en las páginas de error
spring.web.error.include-stacktrace=never
spring.web.error.include-message=never

# Desarrollo: ver cambios de HTML sin reiniciar
spring.thymeleaf.cache=false
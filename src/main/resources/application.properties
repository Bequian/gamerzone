spring.application.name=gamerzone

# Credenciales: definidas como variables de entorno
gamerzone.user.password=${GZ_USER_PASSWORD:ClaveLocal#1}
gamerzone.admin.password=${GZ_ADMIN_PASSWORD:ClaveAdmin#2}
gamerzone.organizador.password=${GZ_ORGANIZADOR_PASSWORD:ClaveOrg#3}

# Sesión y cookies
server.servlet.session.timeout=15m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=strict

# No mostrar detalles internos en las páginas de error
spring.web.error.include-stacktrace=never
spring.web.error.include-message=never

# Desarrollo: ver cambios de HTML sin reiniciar
spring.thymeleaf.cache=false

# ===== Base de datos (MySQL en Docker) =====
# sslMode=REQUIRED: la comunicación entre la app y MySQL viaja cifrada
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:gamerzone}?sslMode=REQUIRED
spring.datasource.username=${DB_USER:gamerzone}
spring.datasource.password=${DB_PASSWORD:GamerZoneLocal#1}

# Hibernate crea y actualiza las tablas según las clases @Entity
spring.jpa.hibernate.ddl-auto=update
# Buena práctica: no mantener la conexión a la BD abierta mientras se dibuja la vista
spring.jpa.open-in-view=false


# ===== JWT =====
# Clave secreta para firmar los tokens (Base64, mínimo 32 bytes).
# En la VM se define con la variable GZ_JWT_SECRET; el valor por defecto es solo para desarrollo local.
gamerzone.jwt.secret=${GZ_JWT_SECRET:/sRASg4Qafyb8TIk0mKrucvkbLZh12Lok5zHUcvE9VE=}
gamerzone.jwt.expiracion-minutos=60

# Detrás del proxy Apache: respeta X-Forwarded-Proto para saber que la conexión original fue HTTPS
server.forward-headers-strategy=framework
spring.application.name=gamerzone

# Credenciales: definidas como variables de entorno
gamerzone.user.password=${GZ_USER_PASSWORD:ClaveLocal#1}
gamerzone.admin.password=${GZ_ADMIN_PASSWORD:ClaveAdmin#2}
gamerzone.organizador.password=${GZ_ORGANIZADOR_PASSWORD:ClaveOrg#3}

# Sesión y cookies
server.servlet.session.timeout=15m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=strict

# No mostrar detalles internos en las páginas de error
spring.web.error.include-stacktrace=never
spring.web.error.include-message=never

# Desarrollo: ver cambios de HTML sin reiniciar
spring.thymeleaf.cache=false
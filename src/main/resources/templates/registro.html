<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GamerZone - Crear cuenta</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
    <link rel="stylesheet" th:href="@{/css/login.css}">
</head>
<body>

    <main class="login-pagina">
        <section class="login-card">
            <a class="logo" th:href="@{/}">Gamer<span>Zone</span></a>
            <p class="login-subtitulo">Crea tu cuenta y únete a la comunidad</p>

            <!-- validaciones a nivel servidor -->
            <form th:action="@{/registro}" th:object="${registro}" method="post" novalidate>
                <div class="campo">
                    <label for="nombre">Nombre</label>
                    <input type="text" id="nombre" th:field="*{nombre}" th:errorclass="invalido"
                           autocomplete="name" maxlength="60" required>
                    <span class="campo-error" th:if="${#fields.hasErrors('nombre')}" th:errors="*{nombre}">Error</span>
                </div>

                <div class="campo">
                    <label for="correo">Correo electrónico</label>
                    <input type="email" id="correo" th:field="*{correo}" th:errorclass="invalido"
                           autocomplete="email" maxlength="100" required>
                    <span class="campo-error" th:if="${#fields.hasErrors('correo')}" th:errors="*{correo}">Error</span>
                </div>

                <div class="campo">
                    <label for="password">Contraseña</label>
                    <input type="password" id="password" th:field="*{password}" th:errorclass="invalido"
                           autocomplete="new-password" maxlength="72" required>
                    <span class="campo-ayuda">Mínimo 8 caracteres, con al menos una letra y un número.</span>
                    <span class="campo-error" th:if="${#fields.hasErrors('password')}" th:errors="*{password}">Error</span>
                </div>

                <div class="campo">
                    <label for="confirmarPassword">Confirmar contraseña</label>
                    <input type="password" id="confirmarPassword" th:field="*{confirmarPassword}" th:errorclass="invalido"
                           autocomplete="new-password" maxlength="72" required>
                    <span class="campo-error" th:if="${#fields.hasErrors('confirmarPassword')}" th:errors="*{confirmarPassword}">Error</span>
                </div>

                <button type="submit" class="btn btn-primario btn-bloque">Crear cuenta</button>
            </form>

            <p class="login-alternativa">
                ¿Ya tienes cuenta? <a th:href="@{/login}">Inicia sesión</a>
            </p>
            <a class="login-volver" th:href="@{/}">← Volver al inicio</a>
        </section>
    </main>

</body>
</html>

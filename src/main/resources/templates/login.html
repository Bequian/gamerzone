<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GamerZone - Iniciar sesión</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
    <link rel="stylesheet" th:href="@{/css/login.css}">
</head>
<body>

    <main class="login-pagina">
        <section class="login-card">
            <a class="logo" th:href="@{/}">Gamer<span>Zone</span></a>
            <p class="login-subtitulo">Inicia sesión para continuar</p>

            <!-- Mensaje genérico: no revela si falló el usuario o la contraseña -->
            <div th:if="${param.error}" class="alerta alerta-error" role="alert">
                Nombre de usuario o contraseña incorrectos.
            </div>

            <div th:if="${param.logout}" class="alerta alerta-exito" role="status">
                Has cerrado sesión correctamente.
            </div>

            <div th:if="${param.registrado}" class="alerta alerta-exito" role="status">
                ¡Cuenta creada! Ya puedes iniciar sesión con tu correo.
            </div>

            <!-- th:action agrega automáticamente el token CSRF oculto -->
            <form th:action="@{/login}" method="post">
                <div class="campo">
                    <label for="username">Correo o nombre de usuario</label>
                    <input type="text" id="username" name="username"
                           autocomplete="username" maxlength="100" autofocus required>
                </div>

                <div class="campo">
                    <label for="password">Contraseña</label>
                    <input type="password" id="password" name="password"
                           autocomplete="current-password" maxlength="72" required>
                </div>

                <button type="submit" class="btn btn-primario btn-bloque">Iniciar sesión</button>
            </form>

            <p class="login-alternativa">
                ¿No tienes cuenta? <a th:href="@{/registro}">Regístrate</a>
            </p>

            <a class="login-volver" th:href="@{/}">← Volver al inicio</a>
        </section>
    </main>

</body>
</html>

# ===== Configuración del proxy HTTPS de GamerZone =====
Listen 443
ServerName gamerzone

# No revelar la versión de Apache en cabeceras ni páginas de error
ServerTokens Prod
ServerSignature Off

SSLSessionCache "shmcb:/usr/local/apache2/logs/ssl_scache(512000)"

# ----- HTTP (puerto 80): todo se redirige a HTTPS -----
<VirtualHost *:80>
    RewriteEngine On
    # /eventos (ruta pedida en las instrucciones) lleva al inicio del sitio
    RewriteRule ^/eventos/?$ https://%{HTTP_HOST}/ [R=301,L]
    RewriteRule ^/(.*)$ https://%{HTTP_HOST}/$1 [R=301,L]
</VirtualHost>

# ----- HTTPS (puerto 443) -----
<VirtualHost *:443>
    SSLEngine on
    SSLCertificateFile    /usr/local/apache2/certs/gamerzone.crt
    SSLCertificateKeyFile /usr/local/apache2/certs/gamerzone.key

    # Solo versiones seguras de TLS
    SSLProtocol -all +TLSv1.2 +TLSv1.3

    # HSTS: el navegador usará siempre HTTPS para este sitio
    Header always set Strict-Transport-Security "max-age=31536000"

    RewriteEngine On
    RewriteRule ^/eventos/?$ / [R=302,L]

    # Reenvía las peticiones a Spring Boot por la red interna de Docker
    ProxyPreserveHost On
    RequestHeader set X-Forwarded-Proto "https"
    RequestHeader set X-Forwarded-Port "443"
    ProxyPass        /eventos !
    ProxyPass        / http://app:8080/
    ProxyPassReverse / http://app:8080/
</VirtualHost>